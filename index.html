<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Mapa de Iglesias y División Provincial - CEBA</title>
        
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        
        <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --border-glass: rgba(226, 232, 240, 0.9);
            --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.12);
        }

        html, body, #map {
            width: 100%;
            height: 100%;
            height: 100dvh;
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }

        .leaflet-container {
            padding-right: 0 !important;
        }

        /* Leaflet Controls Column (Top Left & Top Right) */
        .leaflet-top.leaflet-left {
            top: 14px;
            left: 14px;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.sidebar-open .leaflet-top.leaflet-left {
            left: 354px;
        }
        .leaflet-top.leaflet-right {
            top: 54px;
            right: 4px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* Leaflet Native Sidebar Toggle Control */
        .leaflet-control-sidebar-toggle a {
            background-color: #ffffff;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            color: #334155 !important;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .leaflet-touch .leaflet-control-sidebar-toggle a {
            width: 30px;
            height: 30px;
            line-height: 30px;
        }
        .leaflet-control-sidebar-toggle a:hover {
            background-color: #f8fafc;
            color: var(--primary) !important;
        }
        body.sidebar-open .leaflet-control-sidebar-toggle a,
        body.sidebar-open .leaflet-control-sidebar-toggle a i {
            background-color: #eff6ff;
            color: var(--primary) !important;
        }

        /* Header Info Badge (Top Right) */
        .map-header-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 10px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-glass);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            user-select: none;
            max-width: calc(100vw - 90px);
            box-sizing: border-box;
        }
        .map-header-badge #statsText {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .map-header-badge .badge-dot {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
            background-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.7);
        }

        /* Sidebar Panel (Integrada a los bordes) */
        .sidebar-panel {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 340px;
            z-index: 1002;
            background: #ffffff;
            border-right: 1px solid #cbd5e1;
            border-radius: 0;
            box-shadow: 4px 0 24px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
        }
        body.sidebar-open .sidebar-panel {
            transform: translateX(0);
        }

        /* Sidebar Header (Clean, without church drawing) */
        .sidebar-header {
            padding: 16px 16px 12px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.8) 100%);
        }
        .sidebar-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.2px;
        }
        .sidebar-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s ease;
        }
        .sidebar-close-btn:hover {
            background: #e2e8f0;
            color: var(--text-dark);
        }
        .sidebar-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Search Bar */
        .sidebar-tools {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            background: #ffffff;
        }
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-box i.fa-search {
            position: absolute;
            left: 10px;
            color: #94a3b8;
            font-size: 13px;
        }
        .search-input {
            width: 100%;
            padding: 8px 28px 8px 30px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 12.5px;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            background: #f8fafc;
        }
        .search-input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .search-clear-btn {
            position: absolute;
            right: 8px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            display: none;
            padding: 2px;
            font-size: 12px;
        }
        .search-clear-btn:hover {
            color: #475569;
        }

        /* Active Filter Alert Banner */
        .active-filter-banner {
            display: none;
            padding: 8px 12px;
            background: #eff6ff;
            border-left: 3px solid var(--primary);
            border-bottom: 1px solid #dbeafe;
            font-size: 12px;
            color: #1e40af;
            align-items: center;
            justify-content: space-between;
        }
        .active-filter-banner.show {
            display: flex;
        }
        .reset-filter-link {
            color: #2563eb;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            margin-left: 6px;
        }

        /* Province List Container */
        .province-list {
            flex: 1 1 0%;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .province-list::-webkit-scrollbar {
            width: 5px;
        }
        .province-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .province-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .province-list::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Province Card (Card Container with Accordion) */
        .prov-card {
            flex-shrink: 0;
            min-height: 38px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            display: flex;
            flex-direction: column;
        }
        .prov-card:hover {
            border-color: var(--primary-border);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }
        .prov-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.22);
        }

        /* Header of Card */
        .prov-card-header {
            position: relative;
            padding: 9px 12px;
            min-height: 38px;
            box-sizing: border-box;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            z-index: 2;
            background: #ffffff;
            transition: background-color 0.15s ease;
        }
        .prov-card:hover .prov-card-header {
            background: #f8fafc;
        }
        .prov-card.selected .prov-card-header {
            background: #eff6ff;
        }

        .prov-card-info {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        .prov-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .prov-card.selected .prov-name {
            color: var(--primary-dark);
            font-weight: 700;
        }
        .prov-chevron {
            font-size: 10px;
            color: #94a3b8;
            margin-left: 4px;
            transition: transform 0.25s ease, color 0.2s;
        }
        .prov-card.expanded .prov-chevron {
            transform: rotate(180deg);
            color: var(--primary);
        }
        .prov-count-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 5px;
        }
        .prov-count-badge {
            background: #f1f5f9;
            color: var(--text-dark);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        .prov-card:hover .prov-count-badge,
        .prov-card.selected .prov-count-badge {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }
        .prov-percent {
            font-size: 10px;
            color: #94a3b8;
            min-width: 28px;
            text-align: right;
        }

        /* City / Localidad Sub-list (Accordion) */
        .city-accordion {
            display: none;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 6px 10px 8px;
            max-height: 220px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex-direction: column;
            gap: 4px;
            z-index: 2;
            flex-shrink: 0;
        }
        .prov-card.expanded .city-accordion {
            display: flex;
        }
        .city-accordion::-webkit-scrollbar {
            width: 4px;
        }
        .city-accordion::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .city-row {
            flex-shrink: 0;
            min-height: 28px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-dark);
            transition: all 0.15s ease;
        }
        .city-row:hover {
            background: #eff6ff;
            border-color: var(--primary-border);
            color: var(--primary-dark);
            transform: translateX(2px);
        }
        .city-row.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
            font-weight: 600;
        }
        .city-row-name {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .city-row-name i {
            font-size: 11px;
            color: #64748b !important;
        }
        .city-row.active .city-row-name i {
            color: #ffffff !important;
        }
        .city-row-count {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            background: #f1f5f9;
            color: var(--text-dark);
        }
        .city-row.active .city-row-count {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            padding: 10px 14px;
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }
        .reset-all-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .reset-all-btn:hover {
            background: #f1f5f9;
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Church Popup */
        .church-popup-content {
            font-size: 13px;
            line-height: 1.45;
            color: #334155;
            min-width: 200px;
            max-width: 280px;
        }
        .church-popup-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 6px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }
        .church-popup-row {
            margin-bottom: 4px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }
        .church-popup-row i {
            color: #64748b;
            margin-top: 2px;
            width: 14px;
            text-align: center;
        }
        .church-popup-row strong {
            color: #1e293b;
        }

        /* Mobile Handle & Floating Open Pill (hidden on desktop) */
        .sidebar-mobile-handle {
            display: none;
            width: 38px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 4px;
            margin: 0 auto 8px;
        }
        .mobile-open-pill {
            display: none;
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.38);
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .mobile-open-pill i {
            color: #ffffff !important;
            font-size: 13px;
        }
        .mobile-open-pill:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .leaflet-top.leaflet-left {
                top: 10px;
                left: 10px;
            }
            body.sidebar-open .leaflet-top.leaflet-left {
                left: 10px;
            }
            .leaflet-top.leaflet-right {
                top: 46px;
                right: 2px;
            }
            .map-header-badge {
                top: 10px;
                right: 10px;
                font-size: 11.5px;
                padding: 6px 10px;
                max-width: calc(100vw - 72px);
            }
            .leaflet-control-search input {
                max-width: calc(100vw - 115px) !important;
                font-size: 16px !important;
            }

            /* Bottom Sheet Sidebar compacta e integrada a los bordes inferiores */
            .sidebar-panel {
                width: 100%;
                height: 32vh;
                height: 32dvh;
                max-height: 36dvh;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                border-right: none;
                border-top: 1px solid #cbd5e1;
                border-radius: 14px 14px 0 0;
                padding-bottom: env(safe-area-inset-bottom, 0px);
                box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.12);
                transform: translateY(105%);
            }
            body.sidebar-open .sidebar-panel {
                transform: translateY(0);
            }
            .sidebar-mobile-handle {
                display: block;
                margin: 0 auto 4px;
            }
            .sidebar-header {
                padding: 6px 12px 6px;
                cursor: pointer;
            }
            .sidebar-title {
                font-size: 14px;
            }
            .sidebar-subtitle {
                font-size: 10.5px;
                margin-top: 2px;
            }
            .sidebar-tools {
                padding: 6px 10px;
            }
            /* 16px prevents iOS Safari / Android Chrome auto-zoom on focus */
            .search-input {
                font-size: 16px;
                padding: 5px 26px 5px 28px;
            }
            .prov-card-header {
                padding: 7px 10px;
                min-height: 34px;
            }
            .city-row {
                min-height: 30px;
                padding: 4px 8px;
                font-size: 12.5px;
            }
            .city-accordion {
                max-height: 130px;
            }
            .sidebar-footer {
                padding: 6px 10px;
            }
            .reset-all-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
            .church-popup-content {
                min-width: 180px;
                max-width: calc(100vw - 80px);
                font-size: 12.5px;
            }

            /* Show floating button when bottom sheet is closed */
            body:not(.sidebar-open) .mobile-open-pill {
                display: flex;
            }
            /* Keep attribution above floating pill when sidebar is closed */
            .leaflet-bottom.leaflet-right {
                margin-bottom: env(safe-area-inset-bottom, 0px);
            }
        }
        </style>
    </head>
    <body class="sidebar-open">
        <div id="map"></div>

        <!-- Badge flotante de estado en esquina superior derecha -->
        <div class="map-header-badge" id="statsBadge">
            <span class="badge-dot"></span>
            <span id="statsText">Cargando datos...</span>
        </div>

        <!-- Botón flotante inferior en móviles para abrir el panel cómodamente -->
        <button class="mobile-open-pill" id="mobileOpenSidebarBtn" type="button">
            <i class="fa fa-list-ul"></i>
            <span id="mobileOpenPillText">Provincias y ciudades</span>
        </button>

        <!-- Menú / Barra Lateral de Provincias -->
        <aside class="sidebar-panel" id="sidebar">
            <div class="sidebar-header" id="sidebarHeader">
                <div class="sidebar-mobile-handle"></div>
                <div class="sidebar-header-top">
                    <h2 class="sidebar-title">División Provincial</h2>
                    <button class="sidebar-close-btn" id="sidebarCloseBtn" title="Ocultar panel">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div class="sidebar-subtitle">
                    <span id="totalChurchesCount">1.097 iglesias</span>
                    <span>23 provincias</span>
                </div>
            </div>

            <!-- Buscador de provincias y localidades -->
            <div class="sidebar-tools">
                <div class="search-box">
                    <i class="fa fa-search"></i>
                    <input type="text" id="provSearchInput" class="search-input" placeholder="Buscar provincia o ciudad..." autocomplete="off">
                    <button class="search-clear-btn" id="searchClearBtn" title="Limpiar"><i class="fa fa-times"></i></button>
                </div>
            </div>

            <!-- Banner de filtro provincial o de ciudad activo -->
            <div class="active-filter-banner" id="activeFilterBanner">
                <span>Filtrando: <strong id="activeFilterName">-</strong></span>
                <span class="reset-filter-link" id="clearFilterLink">Ver todo</span>
            </div>

            <!-- Lista con scroll de provincias ordenadas por cantidad -->
            <div class="province-list" id="provinceList"></div>

            <!-- Footer con botón de reset de encuadre al país -->
            <div class="sidebar-footer">
                <span id="filteredStatsLabel">23 provincias</span>
                <button class="reset-all-btn" id="resetMapBoundsBtn" title="Reencuadrar mapa al centro del país">
                    <i class="fa fa-compress-arrows-alt"></i> Todo el país
                </button>
            </div>
        </aside>

        <!-- Librerías JS del visor -->
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        
        <!-- Datos de división provincial e iglesias (empaquetados para soporte offline sin CORS) -->
        <script src="data/provincias_arg.js"></script>
        <script src="data/iglesias_nacion.js"></script>

        <script>
        // Coordenadas del centro geográfico de Argentina continental (La Pampa / Córdoba)
        var ARGENTINA_CENTER = [-38.4161, -63.6167];
        var ARGENTINA_BOUNDS = L.latLngBounds([[-55.1, -73.6], [-21.8, -53.6]]);

        // Limpiar hash previo en URL para evitar saltos indeseados
        if (window.location.hash) {
            try { history.replaceState(null, null, window.location.pathname); } catch(e) {}
        }

        // Inicializar Mapa Leaflet centrado en el centro del país
        var map = L.map('map', {
            zoomControl: false, 
            maxZoom: 28, 
            minZoom: 3,
            zoomSnap: 0.25,
            zoomDelta: 1,
            wheelPxPerZoomLevel: 26,
            wheelDebounceTime: 20,
            center: ARGENTINA_CENTER,
            zoom: 4
        });
        
        map.attributionControl.setPrefix('<a href="https://leafletjs.com" title="Leaflet">Leaflet</a> &middot; <a href="https://wms.ign.gob.ar" target="_blank">IGN Argentina</a>');
        var autolinker = new Autolinker({truncate: {length: 35, location: 'smart'}});

        // 1° en prioridad: Botón integrado en la barra de controles para abrir/cerrar el panel de provincias
        var SidebarToggleControl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function(map) {
                var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-sidebar-toggle');
                var link = L.DomUtil.create('a', '', container);
                link.href = '#';
                link.title = 'Mostrar / Ocultar División Provincial';
                link.id = 'sidebarToggleLeafletBtn';
                link.innerHTML = '<i class="fa fa-bars"></i>';

                    L.DomEvent.preventDefault(e);
                    toggleSidebar();
                });
                return container;
            }
        });
        map.addControl(new SidebarToggleControl());

        // Control de Zoom a la derecha y Localización en topleft
        var zoomControl = L.control.zoom({ position: 'topright' }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);

        // Geocoder Photon / Búsqueda de Lugares en topleft
        var obj2 = {}, obj3 = {};
        const url = {
            "Nominatim OSM": "https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&",
            "France BAN": "https://api-adresse.data.gouv.fr/search/?"
        };
        var photonControl = L.control.photon({
            url: url["Nominatim OSM"],
            feedbackLabel: '',
            position: 'topleft',
            includePosition: true,
            initial: true
        }).addTo(map);

        if (photonControl._container && photonControl._container.childNodes[0]) {
            photonControl._container.childNodes[0].style.borderRadius = "10px";
        }

        var x = null;
        photonControl.on('selected', function(e) {
            if (x != null) {
                if (obj3.marker) map.removeLayer(obj3.marker);
                map.removeLayer(x);
            }
            obj2.gcd = e.choice;
            x = L.geoJSON(obj2.gcd).addTo(map);
            var label = typeof obj2.gcd.properties.label === 'undefined' ? obj2.gcd.properties.display_name : obj2.gcd.properties.label;
            obj3.marker = L.marker(x.getLayers()[0].getLatLng()).bindPopup(label).addTo(map);
            map.setView(x.getLayers()[0].getLatLng(), 15);
            var z = typeof e.choice.properties.label === 'undefined' ? e.choice.properties.display_name : e.choice.properties.label;
            e.target.input.value = z;
        });

        var search = document.getElementsByClassName("leaflet-photon leaflet-control")[0];
        if (search) {
            search.classList.add("leaflet-control-search");
            search.style.display = "flex";
            search.style.backgroundColor = "rgba(255,255,255,0.9)";

            var button = document.createElement("div");
            button.id = "gcd-button-control";
            button.className = "gcd-gl-btn fa fa-search search-button";

            search.insertBefore(button, search.firstChild);
            var last = search.lastChild;
            if (last) {
                last.style.display = "none";
                button.addEventListener("click", function (e) {
                    if (last.style.display === "none") {
                        last.style.display = "block";
                        if (search.querySelector('input')) search.querySelector('input').focus();
                    } else {
                        last.style.display = "none";
                    }
                });
            }
        }

        function toggleSidebar(forceState) {
            if (typeof forceState === 'boolean') {
                if (forceState) {
                    document.body.classList.add('sidebar-open');
                } else {
                    document.body.classList.remove('sidebar-open');
                }
            } else {
                document.body.classList.toggle('sidebar-open');
            }
        }

        document.getElementById('sidebarCloseBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            toggleSidebar(false);
        });

        document.getElementById('mobileOpenSidebarBtn').addEventListener('click', function() {
            toggleSidebar(true);
        });

        // Permitir cerrar el panel en móvil deslizando hacia abajo desde el encabezado
        (function setupMobileSwipeDown() {
            var headerEl = document.getElementById('sidebarHeader');
            var startY = 0;
            headerEl.addEventListener('touchstart', function(e) {
                if (e.touches && e.touches.length === 1) {
                    startY = e.touches[0].clientY;
                }
            }, { passive: true });
            headerEl.addEventListener('touchend', function(e) {
                if (window.innerWidth <= 768 && e.changedTouches && e.changedTouches.length === 1) {
                    var deltaY = e.changedTouches[0].clientY - startY;
                    if (deltaY > 35) {
                        toggleSidebar(false);
                    }
                }
            }, { passive: true });
        })();

        // Capas base de teselas
        map.createPane('pane_MapaIGN_0');
        map.getPane('pane_MapaIGN_0').style.zIndex = 400;
        var layer_MapaIGN_0 = L.tileLayer('https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capabaseargenmap@EPSG:3857@png/{z}/{x}/{-y}.png', {
            pane: 'pane_MapaIGN_0',
            opacity: 1.0,
            attribution: 'IGN Argenmap',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });

        var layer_OSM = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            opacity: 1.0,
            attribution: '&copy; OpenStreetMap contributors',
            minZoom: 1,
            maxZoom: 19
        });
        layer_MapaIGN_0.addTo(map);

        // Panes especiales para que las iglesias estén siempre por encima de las provincias
        map.createPane('pane_provincias');
        map.getPane('pane_provincias').style.zIndex = 450;
        map.createPane('pane_iglesias');
        map.getPane('pane_iglesias').style.zIndex = 500;

        // Variables de estado global
        var provinciasData = null;
        var iglesiasData = null;
        var layer_provincias = null;
        var layer_iglesias = null;
        var provinceLayersMap = {}; // in1 -> Leaflet layer
        var churchMarkers = []; // Array of { layer, feature, in1, cityName, lat, lng }
        var selectedProvinceIn1 = null;
        var selectedCityName = null;
        var totalIglesiasCount = 0;
        var initialArgentinaBounds = ARGENTINA_BOUNDS;

        function getMobileBottomPadding() {
            var isMobile = window.innerWidth <= 768;
            if (!isMobile) return 20;
            var isSidebarOpen = document.body.classList.contains('sidebar-open');
            if (!isSidebarOpen) return 40;
            var sidebarEl = document.getElementById('sidebar');
            var h = sidebarEl ? sidebarEl.offsetHeight : Math.round(window.innerHeight * 0.32);
            return h + 10;
        }

        function fitToArgentina(animate) {
            var isMobile = window.innerWidth <= 768;
            var isSidebarOpen = document.body.classList.contains('sidebar-open');
            var padLeft = isMobile ? 12 : (isSidebarOpen ? 344 : 16);
            var viewBounds = L.latLngBounds([[-55.0, -73.2], [-21.8, -53.6]]);
            map.fitBounds(viewBounds, {
                paddingTopLeft: [padLeft, isMobile ? 42 : 8],
                paddingBottomRight: [isMobile ? 12 : 8, isMobile ? (isSidebarOpen ? Math.round(window.innerHeight * 0.31) : 24) : 8],
                animate: animate !== false
            });
        }
        fitToArgentina(false);

        // Normalización para búsquedas y comparación
        function cleanString(str) {
            if (!str) return '';
            return str.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, "")
                .trim();
        }

        // Formatear nombres de localidades a Title Case elegante
        function formatCityName(name) {
            if (!name || !name.trim()) return 'Localidad sin especificar';
            var raw = name.trim();
            if (/^(caba|c\.a\.b\.a\.|capital federal)$/i.test(raw)) return 'CABA';
            return raw.toLowerCase().split(' ').map(function(word, idx) {
                if (!word) return '';
                if (idx > 0 && ['de', 'del', 'la', 'las', 'el', 'los', 'y', 'en'].includes(word)) {
                    return word;
                }
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        // Validación de coordenadas para Argentina
        function isValidCoordinate(coords) {
            if (!coords || coords.length < 2) return false;
            var lng = coords[0];
            var lat = coords[1];
            if (lat === 0 && lng === 0) return false;
            if (lat > -20 || lat < -57 || lng < -75 || lng > -52) return false;
            return true;
        }

        // Popup de iglesia
        function buildPopupContent(feature) {
            var props = feature.properties || {};
            var nombre = props.IGLESIA || props.Nombre || 'Iglesia Bautista';
            var direccion = props.DIRECCION || props.Direccion || '';
            var ciudad = props.CIUDAD || props.Ciudad || '';
            var provincia = props.PROVINCIA_NOMBRE || props.PROVINCIA || props.Provincia || '';
            var pais = props.PAIS || props.Pais || 'Argentina';
            var cl = props.CL || props.CI || '';

            var html = '<div class="church-popup-content">';
            html += '<div class="church-popup-title">' + autolinker.link(String(nombre)) + '</div>';
            
            if (direccion) {
                html += '<div class="church-popup-row"><i class="fa fa-map-marker-alt"></i> <span><strong>Dirección:</strong> ' + autolinker.link(String(direccion)) + '</span></div>';
            }
            if (ciudad) {
                html += '<div class="church-popup-row"><i class="fa fa-city"></i> <span><strong>Ciudad:</strong> ' + autolinker.link(String(ciudad)) + '</span></div>';
            }
            if (provincia) {
                html += '<div class="church-popup-row"><i class="fa fa-map"></i> <span><strong>Provincia:</strong> ' + autolinker.link(String(provincia)) + '</span></div>';
            }
            if (pais && pais !== 'Argentina') {
                html += '<div class="church-popup-row"><i class="fa fa-globe"></i> <span><strong>País:</strong> ' + autolinker.link(String(pais)) + '</span></div>';
            }
            if (cl && cl !== '0' && cl !== 0) {
                html += '<div class="church-popup-row"><i class="fa fa-tag"></i> <span><strong>Registro C.L.:</strong> ' + cl + '</span></div>';
            }
            html += '</div>';
            return html;
        }

        // Estilos para la división provincial
        function getProvinceStyle(feature) {
            var in1 = feature.properties.in1;
            var isSelected = (selectedProvinceIn1 === in1);
            
            if (isSelected) {
                return {
                    pane: 'pane_provincias',
                    weight: 3,
                    color: '#1d4ed8',
                    opacity: 1,
                    fillColor: '#2563eb',
                    fillOpacity: 0.25,
                    dashArray: ''
                };
            }
            return {
                pane: 'pane_provincias',
                weight: 1.5,
                color: '#2563eb',
                opacity: 0.65,
                fillColor: '#3b82f6',
                fillOpacity: 0.05,
                dashArray: '3, 3'
            };
        }

        // Resaltar únicamente la provincia bajo el cursor, limpiando cualquier otra que haya quedado activa por movimiento rápido
        function highlightProvinceHover(hoveredIn1) {
            if (!layer_provincias) return;
            layer_provincias.eachLayer(function(l) {
                var code = l.feature && l.feature.properties ? l.feature.properties.in1 : null;
                if (code === selectedProvinceIn1) {
                    l.setStyle({
                        weight: 3,
                        color: '#1d4ed8',
                        opacity: 1,
                        fillColor: '#2563eb',
                        fillOpacity: (selectedCityName ? 0.15 : 0.25),
                        dashArray: ''
                    });
                } else if (hoveredIn1 && code === hoveredIn1) {
                    l.setStyle({
                        weight: 2.5,
                        color: '#1d4ed8',
                        opacity: 1,
                        fillColor: '#2563eb',
                        fillOpacity: 0.20,
                        dashArray: ''
                    });
                } else {
                    l.setStyle({
                        weight: 1.5,
                        color: '#2563eb',
                        opacity: 0.65,
                        fillColor: '#3b82f6',
                        fillOpacity: 0.05,
                        dashArray: '3, 3'
                    });
                }
            });
        }

        // Si el mouse sale del contenedor del mapa, limpiar cualquier hover residual
        document.getElementById('map').addEventListener('mouseleave', function() {
            highlightProvinceHover(null);
        });

        // Cargar Capa Provincial
        function initProvinciasLayer(geojsonData) {
            provinciasData = geojsonData;
            provinceLayersMap = {};

            layer_provincias = L.geoJson(geojsonData, {
                style: getProvinceStyle,
                onEachFeature: function(feature, layer) {
                    var p = feature.properties;
                    provinceLayersMap[p.in1] = layer;

                    // Hover y click: limpia todas las demás provincias antes de resaltar la actual
                    layer.on('mouseover', function(e) {
                        highlightProvinceHover(p.in1);
                    });

                    layer.on('mouseout', function(e) {
                        highlightProvinceHover(null);
                    });

                    layer.on('click', function(e) {
                        L.DomEvent.stopPropagation(e);
                        // Si el click cayó muy cerca de un punto de iglesia, abrimos la iglesia en vez de desactivar/cambiar provincia
                        var hitRadiusPx = window.innerWidth <= 768 ? 24 : 18;
                        var nearChurch = findNearestChurchMarker(e.latlng, hitRadiusPx);
                        if (nearChurch) {
                            if (window.innerWidth <= 768 && document.body.classList.contains('sidebar-open')) {
                                toggleSidebar(false);
                            }
                            nearChurch.layer.openPopup();
                            return;
                        }
                        if (selectedProvinceIn1 === p.in1) {
                            clearProvinceSelection();
                            fitToArgentina(true);
                        } else {
                            selectProvince(p.in1, true, true);
                        }
                    });
                }
            });

            layer_provincias.addTo(map);
            initialArgentinaBounds = ARGENTINA_BOUNDS;
            fitToArgentina(false);
            renderSidebarProvinces();
        }

        var hoveredChurchLayer = null;

        // Determina si el mapa está en vista nacional general (donde no se debe poder clickear puntos individuales)
        function isNationalView() {
            var z = map.getZoom() || 4;
            return !selectedProvinceIn1 && !selectedCityName && z < 6.5;
        }

        // Estilo dinámico según nivel de zoom y filtro activo (difuminado a nivel nacional, nítido al acercar)
        function getChurchMarkerStyle(item) {
            var z = map.getZoom() || 4;
            if (selectedCityName) {
                if (item && item.in1 === selectedProvinceIn1 && item.cityName === selectedCityName) {
                    return { radius: 7.5, fillColor: "#2563eb", color: "#ffffff", weight: 2.5, opacity: 1, fillOpacity: 0.95 };
                }
                return { radius: 3.5, fillColor: "#94a3b8", color: "#cbd5e1", weight: 0.5, opacity: 0.2, fillOpacity: 0.08 };
            }
            if (selectedProvinceIn1) {
                if (item && item.in1 === selectedProvinceIn1) {
                    var rProv = z >= 8 ? 6.8 : (z >= 6 ? 6.0 : 5.2);
                    var opProv = z >= 6.5 ? 0.90 : 0.65;
                    return { radius: rProv, fillColor: "#2563eb", color: "#ffffff", weight: z >= 6.5 ? 2 : 1.2, opacity: 0.9, fillOpacity: opProv };
                }
                return { radius: 3.5, fillColor: "#94a3b8", color: "#cbd5e1", weight: 0.5, opacity: 0.2, fillOpacity: 0.08 };
            }
            // Vista general del país: puntos más chicos y limpios en zoom bajo, más grandes al acercar
            if (z < 6.5) {
                return {
                    radius: 3.6,
                    fillColor: "#2563eb",
                    color: "#ffffff",
                    weight: 0.9,
                    opacity: 0.85,
                    fillOpacity: 0.72
                };
            } else if (z < 7.5) {
                return {
                    radius: 5.2,
                    fillColor: "#2563eb",
                    color: "#ffffff",
                    weight: 1.4,
                    opacity: 0.95,
                    fillOpacity: 0.82
                };
            } else {
                return {
                    radius: 6.5,
                    fillColor: "#2563eb",
                    color: "#ffffff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.92
                };
            }
        }

        function updateMarkerInteractivity(item) {
            if (!item || !item.layer || !item.layer._path) return;
            if (isNationalView()) {
                item.layer._path.style.pointerEvents = 'none';
            } else if (selectedCityName) {
                item.layer._path.style.pointerEvents = (item.in1 === selectedProvinceIn1 && item.cityName === selectedCityName) ? 'auto' : 'none';
            } else if (selectedProvinceIn1) {
                item.layer._path.style.pointerEvents = (item.in1 === selectedProvinceIn1) ? 'auto' : 'none';
            } else {
                item.layer._path.style.pointerEvents = 'auto';
            }
        }

        function resetMarkerStyle(markerLayer) {
            if (!markerLayer) return;
            var item = churchMarkers.find(function(m) { return m.layer === markerLayer; });
            markerLayer.setStyle(getChurchMarkerStyle(item));
            updateMarkerInteractivity(item);
        }

        function updateAllChurchMarkersStyle() {
            if (isNationalView() && hoveredChurchLayer) {
                hoveredChurchLayer = null;
                map.getContainer().style.cursor = '';
            }
            churchMarkers.forEach(function(item) {
                if (item.layer !== hoveredChurchLayer) {
                    item.layer.setStyle(getChurchMarkerStyle(item));
                }
                updateMarkerInteractivity(item);
            });
        }

        map.on('zoomend', function() {
            updateAllChurchMarkersStyle();
        });

        // Buscar la iglesia más cercana en píxeles de pantalla (desactivado en vista nacional)
        function findNearestChurchMarker(latlng, maxDistPx) {
            if (isNationalView()) return null;
            if (!latlng || !churchMarkers.length || !map.hasLayer(layer_iglesias)) return null;
            var clickPt = map.latLngToContainerPoint(latlng);
            var bestItem = null;
            var bestDist = maxDistPx;

            for (var i = 0; i < churchMarkers.length; i++) {
                var item = churchMarkers[i];
                // Si hay ciudad o provincia filtrada, considerar únicamente los puntos activos
                if (selectedCityName && (item.in1 !== selectedProvinceIn1 || item.cityName !== selectedCityName)) {
                    continue;
                }
                if (selectedProvinceIn1 && !selectedCityName && item.in1 !== selectedProvinceIn1) {
                    continue;
                }
                var pt = map.latLngToContainerPoint([item.lat, item.lng]);
                var dist = clickPt.distanceTo(pt);
                if (dist <= bestDist) {
                    bestDist = dist;
                    bestItem = item;
                }
            }
            return bestItem;
        }

        // Resaltar magnéticamente el punto más cercano cuando el mouse se acerca (solo fuera de vista nacional)
        map.on('mousemove', function(e) {
            if (isNationalView()) {
                if (hoveredChurchLayer) {
                    resetMarkerStyle(hoveredChurchLayer);
                    hoveredChurchLayer = null;
                }
                map.getContainer().style.cursor = '';
                return;
            }
            var nearItem = findNearestChurchMarker(e.latlng, 16);
            if (nearItem) {
                if (hoveredChurchLayer && hoveredChurchLayer !== nearItem.layer) {
                    resetMarkerStyle(hoveredChurchLayer);
                }
                hoveredChurchLayer = nearItem.layer;
                nearItem.layer.setStyle({ radius: 8.5, fillColor: "#1d4ed8", color: "#ffffff", weight: 2.5, opacity: 1, fillOpacity: 1 });
                map.getContainer().style.cursor = 'pointer';
            } else {
                if (hoveredChurchLayer) {
                    resetMarkerStyle(hoveredChurchLayer);
                    hoveredChurchLayer = null;
                }
                map.getContainer().style.cursor = '';
            }
        });

        // Si el click cae en el fondo del mapa pero dentro del radio sensible de una iglesia, abrir su popup (solo fuera de vista nacional)
        map.on('click', function(e) {
            if (isNationalView()) return;
            var hitRadiusPx = window.innerWidth <= 768 ? 24 : 18;
            var nearChurch = findNearestChurchMarker(e.latlng, hitRadiusPx);
            if (nearChurch) {
                if (window.innerWidth <= 768 && document.body.classList.contains('sidebar-open')) {
                    toggleSidebar(false);
                }
                nearChurch.layer.openPopup();
            }
        });

        // Cargar Capa de Iglesias
        function initIglesiasLayer(geojsonData) {
            iglesiasData = geojsonData;
            churchMarkers = [];
            var validFeaturesCount = 0;
            var invalidFeaturesCount = 0;

            layer_iglesias = L.geoJson(geojsonData, {
                pane: 'pane_iglesias',
                filter: function(feature) {
                    var ok = isValidCoordinate(feature.geometry && feature.geometry.coordinates);
                    if (ok) {
                        validFeaturesCount++;
                        return true;
                    } else {
                        invalidFeaturesCount++;
                        return false;
                    }
                },
                pointToLayer: function(feature, latlng) {
                    var p = feature.properties;
                    var rawCity = p.CIUDAD || p.Ciudad || '';
                    var cName = formatCityName(rawCity);
                    var itemObj = {
                        layer: null,
                        feature: feature,
                        in1: p.PROVINCIA_IN1,
                        cityName: cName,
                        lat: latlng.lat,
                        lng: latlng.lng
                    };
                    var initialStyle = getChurchMarkerStyle(itemObj);
                    initialStyle.pane = 'pane_iglesias';
                    var marker = L.circleMarker(latlng, initialStyle);
                    itemObj.layer = marker;

                    churchMarkers.push(itemObj);

                    return marker;
                },
                onEachFeature: function(feature, layer) {
                    var popupHtml = buildPopupContent(feature);
                    layer.bindPopup(popupHtml, {
                        maxHeight: 340,
                        maxWidth: Math.min(290, window.innerWidth - 56),
                        autoPanPaddingTopLeft: [16, 56],
                        autoPanPaddingBottomRight: [16, 60]
                    });

                    layer.on('click', function(e) {
                        if (isNationalView()) {
                            this.closePopup();
                            if (feature.properties && feature.properties.PROVINCIA_IN1) {
                                selectProvince(feature.properties.PROVINCIA_IN1, true, true);
                            }
                            return;
                        }
                        if (window.innerWidth <= 768 && document.body.classList.contains('sidebar-open')) {
                            toggleSidebar(false);
                        }
                    });

                    layer.on('mouseover', function() {
                        if (isNationalView()) return;
                        if (hoveredChurchLayer && hoveredChurchLayer !== this) {
                            resetMarkerStyle(hoveredChurchLayer);
                        }
                        hoveredChurchLayer = this;
                        this.setStyle({ radius: 8, fillColor: "#1d4ed8", weight: 2.5 });
                    });
                    layer.on('mouseout', function() {
                        if (hoveredChurchLayer === this) {
                            hoveredChurchLayer = null;
                        }
                        resetMarkerStyle(this);
                    });
                }
            });

            layer_iglesias.addTo(map);
            updateAllChurchMarkersStyle();
            totalIglesiasCount = validFeaturesCount + invalidFeaturesCount;

            document.getElementById('totalChurchesCount').innerText = totalIglesiasCount.toLocaleString() + ' iglesias';
            updateStatsBadge();
            renderSidebarProvinces();
        }

        // Obtener ciudades agrupadas y ordenadas para una provincia
        function getCitiesForProvince(in1) {
            var cityMap = {};
            churchMarkers.forEach(function(item) {
                if (item.in1 === in1) {
                    var cName = item.cityName || 'Localidad sin especificar';
                    if (!cityMap[cName]) {
                        cityMap[cName] = {
                            name: cName,
                            count: 0,
                            churches: []
                        };
                    }
                    cityMap[cName].count++;
                    cityMap[cName].churches.push(item);
                }
            });

            var cities = Object.values(cityMap);
            cities.sort(function(a, b) {
                return a.name.localeCompare(b.name, 'es', { sensitivity: 'base' });
            });
            return cities;
        }

        // Actualizar el badge de estado superior y botón flotante móvil
        function updateStatsBadge() {
            var badgeText = '';
            var pillText = 'Provincias y ciudades';
            if (selectedProvinceIn1) {
                var pLayer = provinceLayersMap[selectedProvinceIn1];
                var pProps = pLayer ? pLayer.feature.properties : null;
                var pName = pProps ? pProps.nam : 'Provincia';
                var pCount = pProps ? (pProps.iglesias_count || 0) : 0;
                
                if (selectedCityName) {
                    badgeText = pName + ' › ' + selectedCityName;
                    pillText = 'Lista (' + selectedCityName + ')';
                } else {
                    badgeText = pName + ': ' + pCount + ' iglesias';
                    pillText = 'Lista (' + pName + ')';
                }
            } else {
                badgeText = totalIglesiasCount.toLocaleString() + ' iglesias en Argentina';
            }
            document.getElementById('statsText').innerText = badgeText;
            var pillEl = document.getElementById('mobileOpenPillText');
            if (pillEl) pillEl.innerText = pillText;
        }

        // Renderizar elementos de la lista en la barra lateral en orden alfabético
        function renderSidebarProvinces() {
            if (!provinciasData) return;
            var listEl = document.getElementById('provinceList');
            listEl.innerHTML = '';

            var filterQuery = cleanString(document.getElementById('provSearchInput').value);
            var features = provinciasData.features.slice();

            // Orden alfabético A-Z
            features.sort(function(a, b) {
                return (a.properties.nam || '').localeCompare(b.properties.nam || '', 'es', { sensitivity: 'base' });
            });

            var maxCount = features.length > 0 ? (features[0].properties.iglesias_count || 1) : 1;
            var visibleCount = 0;

            features.forEach(function(feat) {
                var p = feat.properties;
                var nameClean = cleanString(p.nam);
                var cities = getCitiesForProvince(p.in1);

                // Si hay búsqueda, verificar si coincide la provincia o alguna de sus ciudades
                var matchedCities = [];
                if (filterQuery) {
                    var provMatches = nameClean.includes(filterQuery);
                    matchedCities = cities.filter(c => cleanString(c.name).includes(filterQuery));
                    if (!provMatches && matchedCities.length === 0) {
                        return; // Ocultar si ni provincia ni ciudades coinciden
                    }
                }

                visibleCount++;
                var count = p.iglesias_count || 0;

                var isSelected = (selectedProvinceIn1 === p.in1);
                var isExpanded = isSelected || (filterQuery && matchedCities.length > 0);

                var card = document.createElement('div');
                card.className = 'prov-card' + (isSelected ? ' selected' : '') + (isExpanded ? ' expanded' : '');
                card.id = 'provCard_' + p.in1;

                // Cabecera de la provincia limpia (sin barra ni porcentaje)
                var header = document.createElement('div');
                header.className = 'prov-card-header';
                header.innerHTML = 
                    '<div class="prov-card-info">' +
                        '<span class="prov-name" title="' + p.nam + '">' + p.nam + '</span>' +
                        (cities.length > 0 ? '<i class="fa fa-chevron-down prov-chevron"></i>' : '') +
                    '</div>' +
                    '<div class="prov-count-wrap">' +
                        '<span class="prov-count-badge">' + count + '</span>' +
                    '</div>';

                // Hover en cabecera resalta únicamente ese polígono y limpia los demás
                header.addEventListener('mouseenter', function() {
                    highlightProvinceHover(p.in1);
                });

                header.addEventListener('mouseleave', function() {
                    highlightProvinceHover(null);
                });

                // Clic en la provincia: si ya está activa se desactiva todo; si no, se activa
                header.addEventListener('click', function(e) {
                    if (selectedProvinceIn1 === p.in1) {
                        clearProvinceSelection();
                        fitToArgentina(true);
                    } else {
                        selectProvince(p.in1, true, true);
                    }
                });

                card.appendChild(header);

                // Sub-lista desplegable de ciudades y localidades
                if (cities.length > 0) {
                    var accordion = document.createElement('div');
                    accordion.className = 'city-accordion';
                    accordion.id = 'cityAccordion_' + p.in1;

                    cities.forEach(function(city) {
                        var cityRow = document.createElement('div');
                        cityRow.className = 'city-row' + (selectedCityName === city.name && isSelected ? ' active' : '');
                        cityRow.dataset.cityName = city.name;
                        cityRow.innerHTML = 
                            '<span class="city-row-name"><i class="fa fa-map-marker-alt"></i> ' + city.name + '</span>' +
                            '<span class="city-row-count">' + city.count + '</span>';

                        // Clic en ciudad: si ya está activa se desactiva todo; si no, se activa
                        cityRow.addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (selectedProvinceIn1 === p.in1 && selectedCityName === city.name) {
                                clearProvinceSelection();
                                fitToArgentina(true);
                            } else {
                                selectCity(p.in1, city);
                            }
                        });

                        accordion.appendChild(cityRow);
                    });

                    card.appendChild(accordion);
                }

                listEl.appendChild(card);
            });

            if (visibleCount === features.length) {
                document.getElementById('filteredStatsLabel').innerText = '23 provincias';
            } else {
                document.getElementById('filteredStatsLabel').innerText = visibleCount + ' resultados';
            }
        }

        // Seleccionar una ciudad y centrar en ella
        function selectCity(in1, cityObj) {
            selectedProvinceIn1 = in1;
            selectedCityName = cityObj.name;

            // Asegurar que la tarjeta de provincia esté seleccionada y expandida
            document.querySelectorAll('.prov-card').forEach(function(c) {
                c.classList.remove('selected');
            });
            var activeCard = document.getElementById('provCard_' + in1);
            if (activeCard) {
                activeCard.classList.add('selected', 'expanded');
            }

            // Marcar fila de ciudad activa
            document.querySelectorAll('.city-row').forEach(function(r) {
                r.classList.remove('active');
            });
            if (activeCard) {
                var rows = activeCard.querySelectorAll('.city-row');
                rows.forEach(function(r) {
                    if (r.dataset.cityName === cityObj.name) {
                        r.classList.add('active');
                    }
                });
            }

            var pLayer = provinceLayersMap[in1];
            var pProps = pLayer ? pLayer.feature.properties : null;
            var pName = pProps ? pProps.nam : 'Provincia';

            // Actualizar banner activo
            var banner = document.getElementById('activeFilterBanner');
            banner.classList.add('show');
            document.getElementById('activeFilterName').innerHTML = pName + ' &rsaquo; <strong>' + cityObj.name + '</strong> (' + cityObj.count + ')';

            // Resaltar provincia en el mapa
            if (layer_provincias) {
                layer_provincias.eachLayer(function(l) {
                    layer_provincias.resetStyle(l);
                });
                if (pLayer) {
                    pLayer.setStyle({
                        weight: 2.5,
                        color: '#1d4ed8',
                        fillColor: '#2563eb',
                        fillOpacity: 0.15,
                        dashArray: ''
                    });
                    pLayer.bringToFront();
                }
            }

            // Destacar únicamente las iglesias de esta ciudad
            var isMobile = window.innerWidth <= 768;
            var validLatLngs = [];

            updateAllChurchMarkersStyle();
            churchMarkers.forEach(function(item) {
                if (item.in1 === in1 && item.cityName === cityObj.name) {
                    item.layer.bringToFront();
                    validLatLngs.push([item.lat, item.lng]);
                }
            });

            // En móvil, al elegir una ciudad cerramos el panel inferior para ver bien el mapa
            if (isMobile) {
                toggleSidebar(false);
            }

            // Centrar y hacer zoom en la ciudad
            if (validLatLngs.length > 1) {
                var cityBounds = L.latLngBounds(validLatLngs);
                map.fitBounds(cityBounds, {
                    paddingTopLeft: isMobile ? [24, 56] : [350, 40],
                    paddingBottomRight: isMobile ? [24, 70] : [40, 40],
                    maxZoom: 14,
                    animate: true,
                    duration: 0.8
                });
            } else if (validLatLngs.length === 1) {
                map.setView(validLatLngs[0], 14, { animate: true, duration: 0.8 });
                if (cityObj.churches[0] && cityObj.churches[0].layer) {
                    cityObj.churches[0].layer.openPopup();
                }
            }

            updateStatsBadge();
        }

        // Seleccionar una provincia (Interacción mapa <-> sidebar)
        function selectProvince(in1, zoomTo, expandAccordion) {
            selectedProvinceIn1 = in1;
            selectedCityName = null; // Limpiar filtro de ciudad específico para ver toda la provincia
            var targetLayer = provinceLayersMap[in1];

            if (!targetLayer) return;

            var props = targetLayer.feature.properties;

            // Actualizar banner activo
            var banner = document.getElementById('activeFilterBanner');
            banner.classList.add('show');
            document.getElementById('activeFilterName').innerText = props.nam + ' (' + (props.iglesias_count || 0) + ')';

            // Actualizar estilo en mapa de provincias
            if (layer_provincias) {
                layer_provincias.eachLayer(function(l) {
                    layer_provincias.resetStyle(l);
                });
                targetLayer.setStyle({
                    weight: 3,
                    color: '#1d4ed8',
                    fillColor: '#2563eb',
                    fillOpacity: 0.25,
                    dashArray: ''
                });
                targetLayer.bringToFront();
            }

            // Filtrar y destacar iglesias de la provincia
            updateAllChurchMarkersStyle();
            churchMarkers.forEach(function(item) {
                if (item.in1 === in1) {
                    item.layer.bringToFront();
                }
            });

            // Resaltar tarjeta y desplegar ciudades
            document.querySelectorAll('.prov-card').forEach(function(c) {
                c.classList.remove('selected');
            });
            var activeCard = document.getElementById('provCard_' + in1);
            if (activeCard) {
                activeCard.classList.add('selected');
                if (expandAccordion) {
                    activeCard.classList.add('expanded');
                }
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Limpiar selección de ciudad previa
            document.querySelectorAll('.city-row').forEach(function(r) {
                r.classList.remove('active');
            });

            // Zoom hacia la provincia (considerando barra lateral en PC o panel inferior en móvil)
            if (zoomTo && targetLayer.getBounds().isValid()) {
                var isMobile = window.innerWidth <= 768;
                var padBottom = getMobileBottomPadding();
                map.fitBounds(targetLayer.getBounds(), {
                    paddingTopLeft: isMobile ? [20, 52] : [350, 30],
                    paddingBottomRight: isMobile ? [20, padBottom] : [30, 30],
                    maxZoom: 12,
                    animate: true,
                    duration: 0.8
                });
            }

            updateStatsBadge();
        }

        // Limpiar selección (volver a vista general del país)
        function clearProvinceSelection() {
            selectedProvinceIn1 = null;
            selectedCityName = null;

            map.closePopup();
            document.getElementById('activeFilterBanner').classList.remove('show');

            highlightProvinceHover(null);
            updateAllChurchMarkersStyle();

            document.querySelectorAll('.prov-card').forEach(function(c) {
                c.classList.remove('selected', 'expanded');
            });
            document.querySelectorAll('.city-row').forEach(function(r) {
                r.classList.remove('active');
            });

            updateStatsBadge();
        }

        // Búsqueda en tiempo real
        var searchInput = document.getElementById('provSearchInput');
        var clearSearchBtn = document.getElementById('searchClearBtn');

        searchInput.addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                clearSearchBtn.style.display = 'block';
            } else {
                clearSearchBtn.style.display = 'none';
            }
            renderSidebarProvinces();
        });

        clearSearchBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            searchInput.focus();
            renderSidebarProvinces();
        });

        // Botón limpiar filtro
        document.getElementById('clearFilterLink').addEventListener('click', function() {
            clearProvinceSelection();
            fitToArgentina(true);
        });

        // Botón todo el país (footer)
        document.getElementById('resetMapBoundsBtn').addEventListener('click', function() {
            clearProvinceSelection();
            fitToArgentina(true);
        });

        // Control de Capas en esquina superior derecha
        function setupLayersControl() {
            var baseMaps = {
                "Mapa IGN Argenmap": layer_MapaIGN_0,
                "OpenStreetMap": layer_OSM
            };
            var overlayMaps = {
                "División Provincial": layer_provincias,
                "Iglesias": layer_iglesias
            };
            L.control.layers(baseMaps, overlayMaps, { collapsed: true, position: 'topright' }).addTo(map);
        }

        // Cargar Provincias
        if (typeof json_provincias_arg !== 'undefined') {
            initProvinciasLayer(json_provincias_arg);
        } else {
            fetch('data/provincias_arg.geojson')
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    initProvinciasLayer(data);
                })
                .catch(function(err) {
                    console.error('Error al cargar provincias:', err);
                });
        }

        // Cargar Iglesias
        if (typeof json_iglesias_nacion !== 'undefined') {
            initIglesiasLayer(json_iglesias_nacion);
            setupLayersControl();
        } else {
            fetch('data/iglesias_nacion.geojson')
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    initIglesiasLayer(data);
                    setupLayersControl();
                })
                .catch(function(err) {
                    console.error('Error al cargar iglesias:', err);
                    document.getElementById('statsText').innerText = 'Error al cargar datos';
                });
        }
        </script>        
    </body>
</html>
